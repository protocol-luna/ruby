# Configuration Ruby
# Chaîne de Markov universelle pour messages spontanés
# Stockage SQLite avec métadonnées (salon, utilisateur, plateforme)

port: 3127
host: "127.0.0.1"

# Ordre de la chaîne de Markov (2, 3, ou 4)
# Des chaînes pré-entraînées disponibles sur https://huggingface.co/fox3000foxy/ruby-chain
order: 4

# Longueur max du texte généré (en mots)
max_length: 30

# Exclure les messages privés de l'entraînement
skip_dm: true

# Intervalle de sauvegarde de la BD (ms)
save_interval_ms: 60000

# Chemin de la base SQLite
db_path: "chain.db"
